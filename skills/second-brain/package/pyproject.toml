[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain"
version = "0.1.0"
description = "Academic second brain: agentic RAG over a local library of theoretical papers"
requires-python = ">=3.11"
dependencies = [
    "marko>=2.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
web = ["requests>=2.31", "beautifulsoup4>=4.12"]
providers = ["anthropic>=0.40", "openai>=1.40", "claude-agent-sdk>=0.1"]
mcp = ["mcp>=1.2"]
dense = ["sentence-transformers>=3.0"]
ocr = ["marker-pdf>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
